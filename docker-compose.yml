version: "3.9"

services:
  app:
    build:
      context: .
      target: development
    container_name: clickbeard

    ports:
      - "${PORT}:3000"

    env_file:
      - .env

    # Inside the compose network the app must reach Postgres/Redis by
    # service name, not the `localhost` in `.env` (which is correct for
    # running the app directly on the host instead). `environment:`
    # overrides the same keys loaded from `env_file:` above.
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

  postgres:
    image: postgres:17

    container_name: postgres

    restart: unless-stopped

    ports:
      - "${DB_PORT}:5432"

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine

    container_name: redis

    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
